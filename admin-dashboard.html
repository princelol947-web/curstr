<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>
<style>
  :root{--bg:#0a0a0a;--bg-elevated:#171717;--border:#262626;--text:#f5f5f5;--text-muted:#a3a3a3;--text-dim:#737373;--accent:#ef4444;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;}
  header{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--border);}
  header span.email{color:var(--text-dim);font-size:13px;}
  button.signout{
    background:none;border:1px solid var(--border);color:var(--text-muted);
    padding:6px 12px;border-radius:6px;font-size:13px;cursor:pointer;
    transition:transform 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  button.signout:hover{border-color:var(--accent);color:var(--accent);}
  button.signout:active{transform:scale(0.94);}
  main{max-width:960px;margin:0 auto;padding:32px 24px 80px;}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:36px;}
  .stat{background:var(--bg-elevated);border:1px solid var(--border);border-radius:10px;padding:16px;}
  .stat .val{font-size:1.6rem;font-weight:600;}
  .stat .label{font-size:12px;color:var(--text-dim);margin-top:4px;}
  h2{font-size:14px;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-dim);margin-bottom:12px;}
  table{width:100%;border-collapse:collapse;background:var(--bg-elevated);border-radius:10px;overflow:hidden;font-size:14px;}
  th{text-align:left;padding:10px 14px;color:var(--text-dim);border-bottom:1px solid var(--border);font-weight:500;}
  td{padding:10px 14px;border-bottom:1px solid #1e1e1e;}
  .empty{padding:24px;text-align:center;color:var(--text-dim);}
  .note{font-size:12px;color:var(--text-dim);margin-top:10px;}
  .hourbar-row{display:flex;align-items:flex-end;gap:3px;height:100px;background:var(--bg-elevated);
               border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:36px;}
  .hourbar{flex:1;background:var(--accent);border-radius:2px 2px 0 0;min-height:2px;}
</style>
</head>
<body>
<header>
  <div><strong>Admin</strong> · <a href="admin-content.html" style="color:var(--accent);text-decoration:none;font-size:13px;">Manage Content</a></div>
  <div><span class="email" id="userEmail"></span> <button class="signout" id="signOut">Sign out</button></div>
</header>

<main>
  <div class="stats" id="stats"></div>

  <h2>Purchases by hour of day</h2>
  <div class="hourbar-row" id="hourbars"></div>

  <h2>Buyers (last 30 days only)</h2>
  <table>
    <thead><tr><th>Email</th><th>Ebook</th><th>Amount</th><th>Date</th></tr></thead>
    <tbody id="buyersBody"></tbody>
  </table>
  <p class="note">Buyer emails older than 30 days are hidden from this view. Full order records stay in Supabase for accounting purposes.</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="admin-config.js"></script>
<script>
  if (typeof supabase === 'undefined') {
    document.querySelector('main').innerHTML =
      '<p class="empty">Could not load the dashboard system (Supabase library failed to load). Check your internet connection and reload.</p>';
  } else {
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function init() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session || session.user.email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
      window.location.href = 'admin-login.html';
      return;
    }
    document.getElementById('userEmail').textContent = session.user.email;

    const thirtyDaysAgo = new Date(Date.now() - 30 * 24 * 60 * 60 * 1000).toISOString();

    // RLS on the "orders" table should restrict SELECT to the admin's own
    // auth.uid() — see SETUP-STATIC.md. This filter is what limits results
    // to the last 30 days specifically.
    const { data: buyers, error } = await sb
      .from('orders')
      .select('buyer_email, amount_cents, currency, ebook_title, created_at')
      .eq('status', 'paid')
      .gte('created_at', thirtyDaysAgo)
      .order('created_at', { ascending: false });

    if (error) {
      document.getElementById('buyersBody').innerHTML =
        `<tr><td colspan="4" class="empty">Couldn't load buyers: ${error.message}</td></tr>`;
      return;
    }

    renderStats(buyers || []);
    renderHourly(buyers || []);
    renderTable(buyers || []);
  }

  function renderStats(buyers) {
    const revenue = buyers.reduce((sum, b) => sum + b.amount_cents, 0) / 100;
    document.getElementById('stats').innerHTML = `
      <div class="stat"><div class="val">${buyers.length}</div><div class="label">Buyers (30d)</div></div>
      <div class="stat"><div class="val">$${revenue.toFixed(2)}</div><div class="label">Revenue (30d)</div></div>
    `;
  }

  function renderHourly(buyers) {
    const counts = new Array(24).fill(0);
    buyers.forEach(b => counts[new Date(b.created_at).getHours()]++);
    const max = Math.max(...counts, 1);
    const wrap = document.getElementById('hourbars');
    wrap.innerHTML = counts.map((c, h) =>
      `<div class="hourbar" style="height:${(c / max) * 100}%" title="${h}:00 — ${c} purchase(s)"></div>`
    ).join('');
  }

  function renderTable(buyers) {
    const body = document.getElementById('buyersBody');
    if (buyers.length === 0) {
      body.innerHTML = `<tr><td colspan="4" class="empty">No purchases in the last 30 days.</td></tr>`;
      return;
    }
    body.innerHTML = buyers.map(b => `
      <tr>
        <td>${b.buyer_email}</td>
        <td>${b.ebook_title}</td>
        <td>${(b.amount_cents / 100).toFixed(2)} ${b.currency.toUpperCase()}</td>
        <td>${new Date(b.created_at).toLocaleDateString()}</td>
      </tr>
    `).join('');
  }

  document.getElementById('signOut').addEventListener('click', async () => {
    await sb.auth.signOut();
    window.location.href = 'admin-login.html';
  });

  init();
  }
</script>
</body></html>
