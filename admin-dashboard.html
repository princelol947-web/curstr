<style>
  :root{--bg:#0a0a0a;--card:#141414;--card2:#0f0f0f;--border:#292929;--text:#fff;--muted:#aaa;--dim:#7a7a7a;--red:#ff2525;--red-dark:#a80f0f;--red-bg:rgba(255,37,37,.08);}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{color-scheme:dark;}
  body{margin:0;min-height:100vh;background:radial-gradient(800px 380px at 50% -10%,#1a0a0a 0%,var(--bg) 62%) no-repeat,var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
  header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;background:rgba(0,0,0,.88);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,37,37,.35);}
  .brand{display:flex;align-items:center;gap:12px;min-width:0;}
  .brand img{width:44px;height:44px;border-radius:12px;flex:none;box-shadow:0 0 0 1px var(--border);}
  .brand h1{margin:0;font-size:20px;font-weight:800;line-height:1.2;white-space:nowrap;}
  .brand h1 a{color:var(--red);font-size:15px;font-weight:600;text-decoration:none;}
  .brand h1 a:hover{text-decoration:underline;}
  .email{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:13px;margin-top:2px;}
  .signout{display:inline-flex;align-items:center;gap:8px;flex:none;height:42px;padding:0 14px;border:1px solid var(--red);border-radius:12px;background:transparent;color:#fff;font-weight:600;font-size:14px;font-family:inherit;cursor:pointer;transition:background .2s,box-shadow .2s;}
  .signout:hover,.signout:active{background:var(--red);box-shadow:0 0 18px rgba(255,37,37,.4);}
  main{max-width:900px;margin:0 auto;padding:18px 14px 60px;}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
  .stat{padding:16px;border:1px solid var(--border);border-radius:16px;background:var(--card);}
  .stat .val{font-size:26px;font-weight:800;color:var(--red);}
  .stat .label{margin-top:2px;font-size:13px;color:var(--muted);}
  .panel{margin-bottom:16px;padding:16px;border:1px solid var(--border);border-radius:20px;background:linear-gradient(180deg,#171717,var(--card));box-shadow:0 14px 34px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.04);}
  .panel h2{display:flex;align-items:center;gap:12px;margin:0 0 16px;font-size:17px;font-weight:800;letter-spacing:.02em;text-transform:uppercase;}
  .panel h2 svg{color:var(--red);flex:none;}
  .chart{display:flex;gap:8px;}
  .yax{display:flex;flex-direction:column-reverse;justify-content:space-between;height:170px;padding-bottom:0;font-size:12px;color:var(--dim);text-align:right;min-width:18px;}
  .plotwrap{flex:1;min-width:0;}
  .plot{position:relative;height:170px;border:1px solid var(--border);border-radius:12px;background:var(--card2);overflow:hidden;}
  .grid{position:absolute;inset:0;display:flex;flex-direction:column-reverse;justify-content:space-between;pointer-events:none;}
  .grid i{display:block;border-top:1px dashed #2c2c2c;}
  .grid i:first-child{border-top:0;}
  .bars{position:absolute;inset:0;display:flex;align-items:flex-end;gap:2.5%;padding:0 2.5%;}
  .bar{flex:1;min-height:3px;border-radius:3px 3px 0 0;background:linear-gradient(180deg,var(--red),var(--red-dark));transition:filter .2s,height .5s;}
  .bar:hover{filter:brightness(1.3);}
  .xax{display:flex;gap:2.5%;padding:6px 2.5% 0;font-size:11px;color:var(--dim);}
  .xax span{flex:1;text-align:center;overflow:visible;white-space:nowrap;}
  .tablebox{border:1px solid var(--border);border-radius:14px;background:var(--card2);overflow:hidden;}
  table{width:100%;border-collapse:collapse;table-layout:fixed;}
  th{padding:13px 12px;text-align:left;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:#121212;border-bottom:1px solid var(--border);}
  td{padding:14px 12px;font-size:14px;color:#eee;border-bottom:1px solid #202020;overflow-wrap:anywhere;vertical-align:top;}
  tr:last-child td{border-bottom:0;}
  tbody tr{transition:background .2s;}
  tbody tr:hover{background:rgba(255,37,37,.06);}
  td.amt{color:var(--red);font-weight:700;}
  td small{display:block;margin-top:2px;color:var(--dim);font-size:12px;}
  col.c1{width:34%;}col.c2{width:26%;}col.c3{width:17%;}col.c4{width:23%;}
  .state{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:12px;padding:26px 16px;text-align:center;color:var(--muted);border:1px solid var(--border);border-radius:14px;background:var(--card2);font-size:15px;}
  .state svg{color:var(--dim);}
  .state.err{color:#ffb3b3;background:var(--red-bg);border-color:rgba(255,37,37,.55);}
  .state.err svg{color:var(--red);}
  .state small{color:var(--dim);font-size:12px;}
  .note{display:flex;align-items:center;gap:14px;margin-top:14px;padding:14px 16px;font-size:13.5px;line-height:1.5;color:var(--muted);border:1px solid rgba(255,37,37,.4);border-radius:14px;background:var(--red-bg);}
  .note .i{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--red);color:#fff;font-weight:800;font-size:16px;}
  .note .sep{align-self:stretch;width:1px;background:rgba(255,37,37,.35);}
  .loading{color:var(--dim);text-align:center;padding:22px;font-size:14px;}
  @media (max-width:480px){th,td{padding:12px 8px;font-size:13px;}th{font-size:11px;}.brand h1{font-size:18px;}.signout span{display:none;}.signout{padding:0 12px;}}
</style></head><body>
<header>
  <div class="brand">
    <img src="favicon.png" alt="" onerror="this.style.display='none'">
    <div style="min-width:0">
      <h1>Admin</h1>
      <span class="email" id="userEmail"></span>
    </div>
  </div>
  <button class="signout" id="signOut"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg><span>Sign out</span></button>
</header>

<main>
  <div class="stats" id="stats"></div>

  <section class="panel">
    <h2><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg>Purchases by hour of day</h2>
    <div class="chart" id="chart"><div class="loading" style="flex:1">Loading…</div></div>
  </section>

  <section class="panel">
    <h2><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20v-1a5 5 0 0 1 5-5h3a5 5 0 0 1 5 5v1M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14.3A5 5 0 0 1 21.5 19v1"/></svg>Buyers (last 30 days only)</h2>
    <div class="tablebox">
      <table>
        <colgroup><col class="c1"><col class="c2"><col class="c3"><col class="c4"></colgroup>
        <thead><tr><th>Email</th><th>Ebook</th><th>Amount</th><th>Date</th></tr></thead>
        <tbody id="buyersBody"><tr><td colspan="4" class="loading">Loading buyers…</td></tr></tbody>
      </table>
    </div>
    <div id="buyersState"></div>
    <div class="note"><span class="i">i</span><span class="sep"></span><span>Buyer emails older than 30 days are hidden from this view.<br>Full order records stay in Supabase for accounting purposes.</span></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script>
<script src="admin-config.js?v=2"></script>
<script>
  const ICON_USERS = '<svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20v-1a5 5 0 0 1 5-5h3a5 5 0 0 1 5 5v1M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14.3A5 5 0 0 1 21.5 19v1"/></svg>';
  const ICON_WARN = '<svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 7v6M12 16.5h.01"/></svg>';
  const esc = v => String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  if (typeof supabase === 'undefined') {
    document.querySelector('main').innerHTML = '<div class="state err">' + ICON_WARN + 'Could not load the dashboard system (Supabase library failed to load). Check your internet connection and reload.</div>';
  } else if (typeof SUPABASE_URL === 'undefined' || typeof SUPABASE_ANON_KEY === 'undefined' || typeof ADMIN_EMAIL === 'undefined') {
    document.querySelector('main').innerHTML = '<div class="state err">' + ICON_WARN + 'Site configuration failed to load (admin-config.js missing or broken).</div>';
  } else {
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // The orders table's real column names are detected from the data itself, so nothing is guessed or invented.
    const CANDIDATES = {
      email: ['buyer_email', 'email', 'customer_email', 'user_email'],
      ebook: ['ebook_title', 'ebook', 'title', 'product', 'item'],
      amount: ['amount_cents', 'amount', 'total', 'amount_paid', 'price'],
      currency: ['currency'],
      date: ['created_at', 'paid_at', 'inserted_at', 'date']
    };
    const SYMBOLS = { INR: '₹', USD: '$', EUR: '€', GBP: '£' };
    const find = (row, keys) => keys.find(k => row && row[k] !== undefined && row[k] !== null);

    async function init() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session || session.user.email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
        window.location.href = 'admin-login.html';
        return;
      }
      document.getElementById('userEmail').textContent = session.user.email;

      const since = Date.now() - 30 * 24 * 60 * 60 * 1000;
      // RLS on "orders" restricts what the admin can read (see SETUP-STATIC.md). Select * so we never ask for a column that doesn't exist.
      let { data, error } = await sb.from('orders').select('*').gte('created_at', new Date(since).toISOString()).order('created_at', { ascending: false });
      if (error && /created_at|column/i.test(error.message)) {
        ({ data, error } = await sb.from('orders').select('*').limit(1000));   // table has no created_at: filter by whatever date column it has
      }
      if (error) return showError(error.message);

      let rows = data || [];
      if (rows[0] && 'status' in rows[0]) rows = rows.filter(r => !r.status || ['paid', 'succeeded', 'complete', 'completed'].includes(String(r.status).toLowerCase()));
      const map = {};
      for (const k in CANDIDATES) { for (const r of rows) { const f = find(r, CANDIDATES[k]); if (f) { map[k] = f; break; } } }
      if (map.date) rows = rows.filter(r => new Date(r[map.date]).getTime() >= since);
      rows.sort((a, b) => map.date ? new Date(b[map.date]) - new Date(a[map.date]) : 0);

      const buyers = rows.map(r => {
        const raw = Number(r[map.amount]);
        const amount = isNaN(raw) ? null : (map.amount === 'amount_cents' ? raw / 100 : raw);
        const cur = String(r[map.currency] || 'INR').toUpperCase();
        return { email: r[map.email], ebook: r[map.ebook], amount, sym: SYMBOLS[cur] || cur + ' ', date: map.date ? new Date(r[map.date]) : null };
      });
      renderStats(buyers); renderHourly(buyers); renderTable(buyers);
    }

    function showError(msg) {
      document.getElementById('stats').innerHTML = '';
      document.getElementById('chart').innerHTML = '<div class="state err" style="flex:1;margin:0">' + ICON_WARN + 'Couldn\'t load purchase statistics.</div>';
      document.getElementById('buyersBody').innerHTML = '';
      document.getElementById('buyersState').innerHTML = '<div class="state err">' + ICON_WARN + '<b>Couldn\'t load buyers</b>' + esc(msg) + '<small>Check that the "orders" table exists and that your admin account is allowed to read it.</small></div>';
    }

    function renderStats(b) {
      const total = b.reduce((s, x) => s + (x.amount || 0), 0), sym = (b.find(x => x.amount != null) || { sym: '₹' }).sym;
      document.getElementById('stats').innerHTML =
        '<div class="stat"><div class="val">' + b.length + '</div><div class="label">Buyers (30d)</div></div>' +
        '<div class="stat"><div class="val">' + sym + total.toLocaleString('en-IN', { maximumFractionDigits: 2 }) + '</div><div class="label">Revenue (30d)</div></div>';
    }

    function renderHourly(b) {
      const counts = new Array(24).fill(0);
      b.forEach(x => { if (x.date) counts[x.date.getHours()]++; });
      const peak = Math.max(...counts, 0), step = peak <= 5 ? 1 : peak <= 10 ? 2 : Math.ceil(peak / 5), top = Math.max(step * Math.ceil(Math.max(peak, 1) / step), step);
      const ticks = []; for (let v = 0; v <= top; v += step) ticks.push(v);
      document.getElementById('chart').innerHTML =
        '<div class="yax">' + ticks.map(v => '<span>' + v + '</span>').join('') + '</div>' +
        '<div class="plotwrap"><div class="plot"><div class="grid">' + ticks.map(() => '<i></i>').join('') + '</div>' +
        '<div class="bars">' + counts.map((c, h) => '<div class="bar" style="height:' + (c / top * 100) + '%" title="' + String(h).padStart(2, '0') + ':00 — ' + c + ' purchase(s)"></div>').join('') + '</div></div>' +
        '<div class="xax">' + counts.map((c, h) => '<span>' + (h % 2 === 0 ? String(h).padStart(2, '0') : '') + '</span>').join('') + '</div></div>';
    }

    function renderTable(b) {
      const body = document.getElementById('buyersBody'), st = document.getElementById('buyersState');
      if (!b.length) {
        body.innerHTML = '';
        st.innerHTML = '<div class="state">' + ICON_USERS + 'No purchases in the last 30 days.</div>';
        return;
      }
      body.innerHTML = b.map(x => '<tr><td>' + esc(x.email || '—') + '</td><td>' + esc(x.ebook || '—') + '</td><td class="amt">' +
        (x.amount == null ? '—' : x.sym + x.amount.toLocaleString('en-IN', { maximumFractionDigits: 2 })) + '</td><td>' +
        (x.date ? x.date.toLocaleDateString('en-GB') + '<small>' + x.date.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) + '</small>' : '—') + '</td></tr>').join('');
      st.innerHTML = '<div class="state">' + ICON_USERS + 'No more buyer records</div>';
    }

    document.getElementById('signOut').addEventListener('click', async () => {
      await sb.auth.signOut();
      window.location.href = 'admin-login.html';
    });

    init();
  }
</script>
<script src="admin-nav.js"></script>
</body></html>
