<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ebooks — Curse Trading</title>
<style>
  :root {
    --bg:#0a0a0a; --bg-elevated:#171717; --border:#262626;
    --text:#f5f5f5; --text-muted:#a3a3a3; --text-dim:#737373;
    --accent:#ef4444; --accent-hover:#f87171; --accent-dark:#991b1b;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  nav { position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between;
        padding:20px 24px; background:rgba(10,10,10,0.85); backdrop-filter:blur(8px); border-bottom:1px solid var(--border); }
  nav .logo { font-weight:600; letter-spacing:-0.02em; }
  nav .logo span { color:var(--accent); }
  nav a.back { color:var(--text-muted); text-decoration:none; font-size:14px; }
  nav a.back:hover { color:var(--text); }

  main { max-width:1100px; margin:0 auto; padding:48px 24px 80px; }
  h1 { font-size:2rem; margin:0 0 8px; }
  .sub { color:var(--text-muted); margin:0 0 40px; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:24px; }
  .card { background:var(--bg-elevated); border:1px solid var(--border); border-radius:10px;
          padding:18px; display:flex; flex-direction:column; transition: transform 0.15s ease; }
  .card:hover { transform: translateY(-3px); }
  .cover { aspect-ratio:3/4; border-radius:6px; margin-bottom:14px; }
  .card h3 { margin:0 0 4px; font-size:16px; }
  .card p.price { margin:0 0 16px; color:var(--text-dim); font-size:14px; }
  .buy-btn {
    margin-top:auto;
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    color:#fff; font-weight:600;
    text-align:center; padding:10px; border-radius:6px; text-decoration:none; font-size:14px;
    box-shadow: 0 4px 14px rgba(239, 68, 68, 0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
  }
  .buy-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(239, 68, 68, 0.5); filter: brightness(1.08); }
  .buy-btn:active { transform: translateY(0) scale(0.95); box-shadow: 0 2px 8px rgba(239, 68, 68, 0.4); filter: brightness(0.92); }

  footer { border-top:1px solid var(--border); padding:40px 24px; display:flex; flex-wrap:wrap;
           gap:24px; font-size:13px; color:var(--text-dim); }
  footer a { color:inherit; text-decoration:none; }
  footer a:hover { color:var(--text-muted); }
</style>
</head>
<body>

<nav>
  <div class="logo">Curse Trading<span>.</span></div>
  <a href="index.html" class="back">← Home</a>
</nav>

<main>
  <h1>All ebooks</h1>
  <p class="sub">Every purchase goes straight to me — no distributor, no reseller.</p>
  <div class="grid" id="grid"></div>
  <p style="margin-top:28px;font-size:13px;color:var(--text-dim);">By completing a purchase, you agree to our <a href="terms.html" style="color:var(--accent);">Terms</a> and consent to our <a href="privacy.html" style="color:var(--accent);">Privacy Policy</a>, including use of your email to deliver your ebook.</p>
</main>

<footer>
  <a href="terms.html">Terms &amp; Conditions</a>
  <a href="privacy.html">Privacy Policy</a>
  <a href="refund-policy.html">Refund Policy</a>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="admin-config.js"></script>
<script>
  const FALLBACK_EBOOKS = [
    { title: 'The Long Way Home', price: '$9.00', color: 'linear-gradient(135deg,#ef4444,#991b1b)', payment_link: 'https://buy.stripe.com/REPLACE_ME_1' },
    { title: 'Field Notes', price: '$6.50', color: 'linear-gradient(135deg,#78716c,#292524)', payment_link: 'https://buy.stripe.com/REPLACE_ME_2' },
    { title: 'Quiet Hours', price: '$8.00', color: 'linear-gradient(135deg,#57534e,#1c1917)', payment_link: 'https://buy.stripe.com/REPLACE_ME_3' },
    { title: 'After the Rain', price: '$7.25', color: 'linear-gradient(135deg,#dc2626,#7f1d1d)', payment_link: 'https://buy.stripe.com/REPLACE_ME_4' },
  ];

  function escHtml(s) {
    return (s == null ? '' : String(s))
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function safeUrl(u) {
    if (!u) return '#';
    const s = String(u).trim();
    return /^(https?:\/\/|\/|\.\/|#)/i.test(s) ? s : '#';
  }
  function safeColor(c) {
    return /^[a-zA-Z0-9#(),.\-\s%]+$/.test(c || '') ? c : '#0a0a0a';
  }

  function renderGrid(ebooks) {
    const grid = document.getElementById('grid');
    grid.innerHTML = ebooks.map(b => `
      <div class="card">
        <div class="cover" style="background:${safeColor(b.color)}"></div>
        <h3>${escHtml(b.title)}</h3>
        <p class="price">${escHtml(b.price)}</p>
        <a class="buy-btn" href="${safeUrl(b.payment_link)}">Buy now</a>
      </div>
    `).join('');
  }

  async function loadEbooks() {
    let ebooks = FALLBACK_EBOOKS;
    if (typeof supabase !== 'undefined') {
      try {
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const { data, error } = await sb.from('site_content').select('value').eq('key', 'ebooks').single();
        if (!error && data && data.value && data.value.length) ebooks = data.value;
      } catch (e) { /* fall back to defaults below */ }
    }
    renderGrid(ebooks);
  }
  loadEbooks();
</script>
<script src="chatbot.js"></script>
</body>
</html>
