<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ebooks — Inkwell</title>
<style>
  :root {
    --bg:#0a0a0a; --bg-elevated:#171717; --border:#262626;
    --text:#f5f5f5; --text-muted:#a3a3a3; --text-dim:#737373;
    --accent:#f59e0b; --accent-hover:#fbbf24;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  nav { position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between;
        padding:20px 24px; background:rgba(10,10,10,0.85); backdrop-filter:blur(8px); border-bottom:1px solid var(--border); }
  nav .logo { font-weight:600; letter-spacing:-0.02em; }
  nav .logo span { color:var(--accent); }
  nav a.back { color:var(--text-muted); text-decoration:none; font-size:14px; }
  nav a.back:hover { color:var(--text); }

  main { max-width:1100px; margin:0 auto; padding:48px 24px 80px; }
  h1 { font-size:2rem; margin:0 0 8px; }
  .sub { color:var(--text-muted); margin:0 0 40px; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:24px; }
  .card { background:var(--bg-elevated); border:1px solid var(--border); border-radius:10px;
          padding:18px; display:flex; flex-direction:column; }
  .cover { aspect-ratio:3/4; border-radius:6px; margin-bottom:14px; }
  .card h3 { margin:0 0 4px; font-size:16px; }
  .card p.price { margin:0 0 16px; color:var(--text-dim); font-size:14px; }
  .buy-btn { margin-top:auto; background:var(--accent); color:#0a0a0a; font-weight:600;
             text-align:center; padding:10px; border-radius:6px; text-decoration:none; font-size:14px; }
  .buy-btn:hover { background:var(--accent-hover); }

  footer { border-top:1px solid var(--border); padding:40px 24px; display:flex; flex-wrap:wrap;
           gap:24px; font-size:13px; color:var(--text-dim); }
  footer a { color:inherit; text-decoration:none; }
  footer a:hover { color:var(--text-muted); }
</style>
</head>
<body>

<nav>
  <div class="logo">Inkwell<span>.</span></div>
  <a href="index.html" class="back">← Home</a>
</nav>

<main>
  <h1>All ebooks</h1>
  <p class="sub">Every purchase goes straight to me — no distributor, no reseller.</p>
  <div class="grid" id="grid"></div>
</main>

<footer>
  <a href="terms.html">Terms &amp; Conditions</a>
  <a href="privacy.html">Privacy Policy</a>
  <a href="refund-policy.html">Refund Policy</a>
</footer>

<script src="ebooks-data.js"></script>
<script>
  const grid = document.getElementById('grid');
  EBOOKS.forEach(b => {
    grid.insertAdjacentHTML('beforeend', `
      <div class="card">
        <div class="cover" style="background:${b.color}"></div>
        <h3>${b.title}</h3>
        <p class="price">${b.price}</p>
        <a class="buy-btn" href="${b.paymentLink}">Buy now</a>
      </div>
    `);
  });
</script>
</body>
</html>
