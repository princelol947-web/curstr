<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0a0a">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://checkout.razorpay.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-src https://api.razorpay.com https://checkout.razorpay.com; form-action 'self'; base-uri 'self'; object-src 'none'">
<title>Blaze Coins | Curse Trading</title>
<style>
  :root{--bg:#0a0a0a;--card:#171717;--border:#262626;--text:#f5f5f5;--muted:#a3a3a3;--accent:#ef4444;--gold:#f5d36b}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border)}
  header a.back{color:var(--text);text-decoration:none;font-size:22px;line-height:1}
  header h1{font-size:18px;margin:0;flex:1}
  .bal{display:flex;align-items:center;gap:6px;font-weight:600;color:var(--gold)}
  main{max-width:560px;margin:0 auto;padding:20px 16px 60px}
  .tier{font-size:38px;font-weight:700;margin:6px 0 2px}.muted{color:var(--muted);font-size:14px}
  .bar{height:10px;border-radius:99px;background:var(--border);overflow:hidden;margin:16px 0 8px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,#b57a1c,#f7cf62);transition:width .5s}
  .tabs{display:flex;border-bottom:1px solid var(--border);margin:24px 0 16px}
  .tabs button{flex:1;background:none;border:0;color:var(--muted);padding:12px;font:600 15px inherit;font-family:inherit;cursor:pointer;border-bottom:3px solid transparent}
  .tabs button.on{color:var(--text);border-color:var(--accent)}
  .row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px}
  .row div{flex:1}.row b{display:block;font-size:15px}
  button.go{background:linear-gradient(135deg,var(--accent),#991b1b);color:#fff;border:0;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer}
  button.go:disabled{background:#2a2a2a;color:#777;cursor:not-allowed}
  .prize{background:linear-gradient(135deg,#2a1f08,#171717);border-color:#4a3a14}
  h3{margin:20px 0 10px;font-size:16px}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;border:1px solid #444;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.3s}
  #toast.show{opacity:1}
</style>
<script src="theme.js"></script>
<script src="orbs.js?v=3"></script>
</head>
<body>
<header>
  <a class="back" href="index.html" aria-label="Back">←</a><h1>Blaze Coins</h1>
  <div class="bal"><span id="ico"></span><span id="bal">0</span></div>
</header>
<main>
  <div class="muted" id="guest" style="display:none;margin-bottom:8px">Sign in so your coins are saved to your account.</div>
  <div class="tier" id="tier"></div>
  <div class="muted" id="rate"></div>
  <div class="bar"><i id="fill"></i></div>
  <div class="muted" id="left"></div>
  <div class="tabs" id="tabs"><button data-t="earn" class="on">Earn</button><button data-t="use">Use</button><button data-t="perks">Perks</button></div>
  <div id="body"></div>
</main>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script>
<script src="admin-config.js?v=2"></script>
<script src="blaze-config.js"></script>
<script src="blaze-coins.js"></script>
<script>
  const B = BlazeCoins, C = B.cfg; let tab = 'earn';
  document.getElementById('ico').innerHTML = B.icon(26);
  const $ = id => document.getElementById(id);
  const esc = v => String(v).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)}
  const row = (t, s, btn) => `<div class="row"><div><b>${t}</b><span class="muted">${s}</span></div>${btn||''}</div>`;

  function draw(s, t) {
    $('bal').textContent = B.fmt(s.balance);
    $('tier').textContent = t.cur.name;
    $('rate').textContent = `Earning ${t.cur.rate} coins per ${C.currency}${C.perUnit} spent`;
    $('fill').style.width = t.pct + '%';
    $('left').textContent = t.nx ? `${B.fmt(t.left)} coins to ${t.nx.name}` : 'You are at the top tier';
    $('guest').style.display = B.signedIn() ? 'none' : 'block';
    let h = '';
    if (tab === 'earn') {
      h = row('Buy an ebook', `${t.cur.rate} coins for every ${C.currency}${C.perUnit} you spend`) + row('Your history', 'See every coin you earned or used in My Account.');
    } else if (tab === 'use') {
      h = row('Redeeming coins is not available yet', 'We will announce it here when it opens.');
    } else {
      h = '<h3>' + esc(t.cur.name) + ' perks</h3>' + t.cur.perks.map(p => row(esc(p), '')).join('') + '<h3>Weekly prize</h3>' + row('Coming soon', 'Weekly prizes are not available yet.');
    }
    $('body').innerHTML = h;
  }
  B.on(draw);
  $('tabs').onclick = e => { const b = e.target.closest('button'); if (!b) return;
    tab = b.dataset.t; [...$('tabs').children].forEach(x => x.classList.toggle('on', x === b)); draw(B.get(), B.info()); };
</script>
</body>
</html>
