<style>
  :root {
    --bg: #0a0a0a;
    --bg-elevated: #171717;
    --border: #262626;
    --text: #f5f5f5;
    --text-muted: #a3a3a3;
    --text-dim: #737373;
    --accent: #ef4444;
    --accent-hover: #f87171;
    --accent-dark: #991b1b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  #bg-canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
    display: block;
  }

  nav {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 24px;
    background: rgba(10,10,10,0.85);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  nav .logo { font-weight: 600; letter-spacing: -0.02em; white-space: nowrap; margin-right: auto; margin-left: 2px; }
  nav .logo-text > span { color: var(--accent); }
  nav .logo a { display: flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; }
  nav .logo img { height: 34px; width: 34px; object-fit: contain; display: block; }
  nav .links { display: flex; gap: 24px; font-size: 14px; color: var(--text-muted); }
  /* Search: a round liquid-metal button that opens into a search bar */
  @property --ang { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
  @keyframes metalspin { to { --ang: 360deg; } }
  .nav-search { position: relative; display: flex; align-items: center; gap: 8px; margin: 0 12px 0 0; isolation: isolate; }
  .ns-field { width: 0; opacity: 0; overflow: hidden; display: flex; align-items: center; height: 38px; padding: 0; border-radius: 999px; background: rgba(255,255,255,0.05); border: 1px solid transparent; transition: width .35s cubic-bezier(.2,.8,.2,1), opacity .25s, padding .35s, border-color .35s; }
  .nav-search.open .ns-field { width: 210px; opacity: 1; padding: 0 16px; border-color: rgba(255,255,255,0.1); box-shadow: inset 0 1px 0 rgba(255,255,255,0.06); }
  .nav-search input { flex: 1; min-width: 0; width: 100%; background: none; border: 0; outline: none; color: var(--text); font-size: 14px; padding: 0; }
  .metal-btn { position: relative; width: 38px; height: 38px; flex: none; border-radius: 50%; padding: 2px; border: 0; cursor: pointer; color: #fff; display: grid; place-items: center;
               background: conic-gradient(from var(--ang), #3b3b42, #f1f2f7, #7c8190, #ffffff, #4a4d57, #cfd2dc, #3b3b42); animation: metalspin 5s linear infinite; }
  .metal-btn::before { content: ''; position: absolute; inset: -7px; border-radius: 50%; z-index: -1; filter: blur(9px); animation: metalspin 3.5s linear infinite;
                       background: conic-gradient(from calc(var(--ang) + 40deg), transparent 0 72%, rgba(130,165,255,0.55) 86%, transparent 100%); }
  .metal-btn .in { width: 100%; height: 100%; border-radius: 50%; background: #1b1b1d; display: grid; place-items: center; }
  .metal-btn .arr { display: none; }
  .nav-search.open .metal-btn .mag { display: none; }
  .nav-search.open .metal-btn .arr { display: block; }
  @media (prefers-reduced-motion: reduce) { .metal-btn, .metal-btn::before { animation: none; } }
  @media (max-width: 600px) {
    .nav-search.open { position: absolute; inset: 0; margin: 0; padding: 0 12px; background: #0c0c0d; z-index: 5; justify-content: flex-end; }
    .nav-search.open .ns-field { width: calc(100vw - 76px); }
  }
  .hamburger-btn { background: none; border: none; color: var(--text); cursor: pointer; padding: 4px 2px; display: flex; }
  .hamburger-btn svg { width: 22px; height: 22px; }
  .nav-right { display: flex; align-items: center; gap: 12px; }
  .profile-icon { color: var(--text-muted); display: flex; padding: 4px; border-radius: 50%; transition: color 0.15s ease, background 0.15s ease; }
  .profile-icon svg { width: 20px; height: 20px; }
  .profile-icon:hover { color: #fff; background: rgba(239,68,68,0.2); }
  .dropdown-menu { position: absolute; top: 100%; left: 24px; margin-top: 6px; background: var(--bg-elevated);
                    border: 1px solid var(--border); border-radius: 8px; padding: 8px; display: none; flex-direction: column;
                    min-width: 180px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); z-index: 30; }
  .dropdown-menu.open { display: flex; }
  .dropdown-menu a { color: var(--text-muted); text-decoration: none; padding: 8px 10px; border-radius: 6px; font-size: 14px; }
  .dropdown-menu a:hover { background: rgba(239,68,68,0.15); color: #fff; }
  nav .links a { color: inherit; text-decoration: none; white-space: nowrap; }
  nav .links a:hover { color: var(--text); }
  nav .cta {
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    color: #fff;
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    box-shadow: 0 3px 10px rgba(239, 68, 68, 0.3);
    transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
  }
  nav .cta:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(239, 68, 68, 0.45); filter: brightness(1.08); }
  nav .cta:active { transform: translateY(0) scale(0.95); box-shadow: 0 2px 6px rgba(239, 68, 68, 0.35); filter: brightness(0.92); }
  @media (max-width: 480px) {
    /* one compact row: menu, logo, then search + coins + profile + sign in */
    nav { padding: 10px 12px; gap: 6px; flex-wrap: nowrap; }
    nav .logo { font-size: 14px; flex: 1 1 0; min-width: 0; margin-left: 0; margin-right: 0; }
    nav .logo a { gap: 6px; min-width: 0; }
    nav .logo img { height: 26px; width: 26px; flex: none; }
    nav .logo-text { display: block; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .nav-search { margin: 0 !important; }
    .metal-btn { width: 34px; height: 34px; }
    .nav-right { gap: 4px; flex: none; }
    .profile-icon { padding: 2px; }
    nav .cta { padding: 6px 10px; font-size: 12.5px; white-space: nowrap; }
    nav .blaze-chip { padding: 2px 8px 2px 3px !important; font-size: 12px !important; gap: 4px !important; }
    nav .blaze-chip svg { width: 20px; height: 20px; }
    .hamburger-btn { padding: 4px 0 !important; }
  }

  .hero {
    position: relative;
    min-height: 90vh;
    display: flex;
    align-items: center;
    padding: 60px 24px;
  }
  @media (min-width: 860px) {
    .hero { padding: 60px 64px; }
  }
  .hero-content {
    max-width: 600px;
    background: rgba(0,0,0,0.72);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px 28px;
  }

  .eyebrow {
    display: inline-block;
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    color: #fff;
    font-size: 12px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 5px 12px;
    border-radius: 6px;
    margin-bottom: 16px;
  }
  h1 {
    font-size: clamp(2.2rem, 6vw, 3.75rem);
    line-height: 1.05;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.02em;
  }
  .lede {
    margin-top: 24px;
    color: var(--text-muted);
    max-width: 420px;
    line-height: 1.6;
    font-size: 15px;
  }
  .browse-btn {
    display: inline-block;
    margin-top: 32px;
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    color: #fff;
    font-weight: 600;
    padding: 12px 24px;
    border-radius: 6px;
    text-decoration: none;
    border: none;
    cursor: pointer;
    font-size: 15px;
    box-shadow: 0 4px 14px rgba(239, 68, 68, 0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
  }
  .browse-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(239, 68, 68, 0.5); filter: brightness(1.08); }
  .browse-btn:active { transform: translateY(0) scale(0.95); box-shadow: 0 2px 8px rgba(239, 68, 68, 0.4); filter: brightness(0.92); }

  section.catalog {
    position: relative;
    max-width: 1100px;
    margin: 0 auto;
    padding: 80px 24px 40px;
  }
  section.catalog h2 {
    display: inline-block;
    font-size: 1.5rem;
    margin: 0;
    background: rgba(0,0,0,0.72);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 20px;
  }
  .catalog-header { margin-bottom: 20px; }
  .catalog-header p { margin: 12px 0 0; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 20px;
  }
  .cat-chips { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 24px; scrollbar-width: none; }
  .cat-chips::-webkit-scrollbar { display: none; }
  .cat-chip { flex: none; background: rgba(0,0,0,0.72); border: 1px solid var(--border); color: var(--text); border-radius: 999px; padding: 8px 18px; font-size: 14px; font-family: inherit; cursor: pointer; }
  .cat-chip.on { background: linear-gradient(135deg, var(--accent), var(--accent-dark)); border-color: transparent; color: #fff; }
  /* Same see-through black box as the "Latest releases" heading */
  .filter-glass { display: inline-block; max-width: 100%; box-sizing: border-box; margin: 0 0 28px; padding: 14px 16px 12px; border-radius: 12px; background: rgba(0,0,0,0.72); border: 1px solid var(--border); }
  .filter-glass.open { display: block; width: 100%; }
  .fg-head { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 10px; isolation: isolate; }
  .fg-title { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); margin: 0 4px; }
  .fg-form { display: none; align-items: center; gap: 8px; height: 44px; padding: 0 6px 0 16px; margin-bottom: 12px; border-radius: 999px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); }
  .filter-glass.open .fg-form { display: flex; animation: fgIn .28s ease; }
  .fg-form:focus-within { border-color: rgba(255,255,255,0.32); box-shadow: 0 0 16px rgba(220,225,245,0.14); }
  .fg-form input { flex: 1; min-width: 0; background: none; border: 0; outline: none; color: var(--text); font-size: 15px; font-family: inherit; padding: 0; }
  .fg-form input::placeholder { color: var(--text-muted); }
  .fg-form input::-webkit-search-cancel-button { display: none; }
  .fg-go { width: 34px; height: 34px; flex: none; border: 0; border-radius: 50%; display: grid; place-items: center; cursor: pointer; color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-dark)); }
  @keyframes fgIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  .fg-none { color: var(--text-muted); font-size: 14px; padding: 4px 6px 10px; }
  #catalogSections { display: flex; flex-direction: column; }
  .filter-glass .cat-chips { margin: 0; padding: 0 0 2px; }
  .cat-sec { margin-bottom: 36px; }
  /* Sideways rows: exactly 2 ebooks per screen, snap one pair at a time */
  .hrow { display: grid; grid-auto-flow: column; grid-auto-columns: calc((100% - 12px) / 2); gap: 12px; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; overscroll-behavior-x: contain; padding: 0 0 12px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .hrow::-webkit-scrollbar { display: none; }
  /* Cards keep the same proportions on every screen: cover, text and padding all scale with the card width */
  .hrow .card { width: auto; min-width: 0; box-sizing: border-box; overflow: hidden; scroll-snap-align: start; scroll-snap-stop: always; padding: 0; container-type: inline-size; }
  .hrow .card > * { margin-left: 8px; margin-right: 8px; margin-left: 6.3cqw; margin-right: 6.3cqw; }
  .hrow .card > :first-child { margin-top: 10px; margin-top: 6.3cqw; }
  .hrow .card > :last-child { margin-bottom: 10px; margin-bottom: 6.3cqw; }
  .hrow .card .cover { display: block; width: 100% !important; max-width: 100% !important; height: auto !important; aspect-ratio: 23 / 25; object-fit: cover; margin-bottom: 8px; margin-bottom: 5cqw; }
  .hrow .card h3 { font-size: 14px; font-size: 9cqw; }
  .hrow .card p { font-size: 12px; font-size: 7.6cqw; }
  .hrow .card h3, .hrow .card p { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 0; margin-bottom: 4px; margin-bottom: 2.5cqw; }
  .catalog, #catalogSections, .cat-sec { min-width: 0; max-width: 100%; }
  html, body { overflow-x: clip; }
  .card {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .card:hover { transform: translateY(-3px); border-color: #3a3a3a; }
  .cover {
    aspect-ratio: 3/4;
    border-radius: 6px;
    margin-bottom: 12px;
    background: linear-gradient(135deg, var(--accent), #991b1b);
  }
  .card h3 { font-size: 14px; margin: 0 0 4px; }
  .card p { font-size: 13px; color: var(--text-dim); margin: 0; }

  footer {
    position: relative;
    margin: 0 24px 24px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    font-size: 13px;
    color: var(--text-dim);
  }
  footer a { color: inherit; text-decoration: none; }
  footer a:hover { color: var(--text-muted); }
  .link-chip {
    display: inline-block;
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    color: #fff !important;
    border-radius: 8px;
    padding: 7px 16px;
    text-decoration: none !important;
    box-shadow: 0 3px 10px rgba(239, 68, 68, 0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
  }
  .link-chip:hover { transform: translateY(-2px); filter: brightness(1.08); box-shadow: 0 6px 16px rgba(239, 68, 68, 0.5); }
  .link-chip:active { transform: translateY(0) scale(0.95); filter: brightness(0.92); }

  .banner {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--bg-elevated);
    border-top: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    font-size: 13px;
    color: var(--text-muted);
    z-index: 30;
  }
  .banner button {
    background: var(--accent);
    color: #0a0a0a;
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
  }
  .note {
    position: fixed;
    top: 70px;
    right: 16px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 12px;
    color: var(--text-dim);
    max-width: 220px;
    z-index: 15;
  }

  /* Promo banner slider */
  .slider {
    position: relative;
    overflow: hidden;
    height: 220px;
  }
  @media (min-width: 860px) { .slider { height: 280px; } }
  .slider-track {
    display: flex;
    height: 100%;
    transition: transform 0.5s ease;
  }
  .slide {
    min-width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    padding: 0 24px;
  }
  @media (min-width: 860px) { .slide { padding: 0 64px; } }
  .slide h3 { font-size: 1.4rem; margin: 0 0 8px; }
  .slide p { margin: 0 0 16px; color: rgba(245,245,245,0.8); max-width: 420px; font-size: 14px; }
  .slide-cta {
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    color: #fff;
    padding: 8px 18px;
    border-radius: 6px;
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    width: fit-content;
    box-shadow: 0 3px 10px rgba(239, 68, 68, 0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
  }
  .slide-cta:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(239, 68, 68, 0.5); filter: brightness(1.08); }
  .slide-cta:active { transform: translateY(0) scale(0.94); box-shadow: 0 2px 6px rgba(239, 68, 68, 0.4); filter: brightness(0.92); }
  .slider-dots {
    position: absolute;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
  }
  .slider-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,0.4);
    border: none;
    cursor: pointer;
    padding: 0;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .slider-dot.active { background: var(--accent); }
  .slider-dot:active { transform: scale(0.7); }
  .slider-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(0,0,0,0.35);
    border: none;
    color: #fff;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 5;
    transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
  }
  .slider-arrow.prev { left: 12px; }
  .slider-arrow.next { right: 12px; }
  .slider-arrow:hover { background: var(--accent); box-shadow: 0 4px 12px rgba(239, 68, 68, 0.5); }
  .slider-arrow:active { transform: translateY(-50%) scale(0.85); }

<script>
  // --- Load banners + ebooks from Supabase (admin-editable via Manage Content) ---
  const FALLBACK_BANNERS = [
    { title: 'New release: Quiet Hours', subtitle: 'Our most personal collection yet — out now.', cta_text: 'Get it now', cta_link: 'ebooks.html', color: 'linear-gradient(135deg,#7f1d1d,#0a0a0a)' },
    { title: 'Buy 2, save 15%', subtitle: 'Mix and match any two titles at checkout.', cta_text: 'See ebooks', cta_link: 'ebooks.html', color: 'linear-gradient(135deg,#991b1b,#0a0a0a)' },
    { title: 'Read the first chapter free', subtitle: 'No account needed, no strings attached.', cta_text: 'Start reading', cta_link: 'ebooks.html', color: 'linear-gradient(135deg,#b91c1c,#0a0a0a)' },
  ];
  const FALLBACK_EBOOKS = [];   // no placeholder products: the real list always comes from the database

  function escHtml(s) {
    return (s == null ? '' : String(s))
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function safeUrl(u) {
    if (!u) return '#';
    const s = String(u).trim();
    return /^(https?:\/\/|\/|\.\/|#)/i.test(s) ? s : '#';
  }
  function safeImg(u) {
    // Only allow https image links (our own storage), no quotes or brackets
    return /^https:\/\/[^\s'"()<>]+$/.test(u || '') ? u : '';
  }
  function safeColor(c) {
    // Only allow simple CSS color/gradient syntax — blocks any attempt to break out via url()/expression/etc.
    return /^[a-zA-Z0-9#(),.\-\s%]+$/.test(c || '') ? c : '#0a0a0a';
  }

  function renderBannerSlides(banners) {
    const track = document.getElementById('sliderTrack');
    track.innerHTML = banners.map(b => `
      <div class="slide" style="background:${safeColor(b.color)}${safeImg(b.image) ? `;background-image:linear-gradient(90deg,rgba(0,0,0,.62),rgba(0,0,0,.18)),url('${safeImg(b.image)}');background-size:cover;background-position:center` : ''}">
        <h3>${escHtml(b.title)}</h3>
        <p>${escHtml(b.subtitle || '')}</p>
        <a href="${safeUrl(b.cta_link || 'ebooks.html')}" class="slide-cta">${escHtml(b.cta_text || 'See more')}</a>
      </div>
    `).join('');
  }

  // Categories: uses the ebook's "category" field if it has one, otherwise matches words in the title.
  // Edit the keywords below to add or change sections.
  const CATEGORIES = [
    { name: 'Psychology', keywords: ['psych', 'mind', 'emotion', 'habit', 'behavio', 'mental'] },
    { name: 'Trading', keywords: ['trad', 'market', 'chart', 'forex', 'stock', 'crypto', 'invest', 'candle'] },
  ];
  function catOf(b) {
    if (b.category) return String(b.category).trim();
    const t = (b.title || '').toLowerCase();
    const m = CATEGORIES.find(c => c.keywords.some(k => t.includes(k)));
    return m ? m.name : '';
  }
  function cardHTML(b) {
    return `
      <a href="ebooks.html" class="card" style="text-decoration:none;color:inherit;display:block;position:relative;min-width:0;overflow:hidden;box-sizing:border-box;">
        <div style="position:relative;">
          ${b.cover_image
            ? `<img src="${safeUrl(b.cover_image)}" alt="${escHtml(b.title)} cover" class="cover" style="object-fit:cover;width:100%;max-width:100%;display:block;">`
            : `<div class="cover" style="background:${safeColor(b.color)};width:100%;"></div>`}
          ${b.sold_out ? `<div style="position:absolute;inset:0;background:rgba(0,0,0,0.72);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:12px;border-radius:6px;">SOLD OUT</div>` : ''}
        </div>
        <h3>${escHtml(b.title)}</h3>
        <p>${escHtml(b.price)}</p>
      </a>
    `;
  }
  function renderCatalogGrid(ebooks) {
    if (!ebooks.length) { document.getElementById('catChips').innerHTML = ''; document.getElementById('catalogSections').innerHTML = '<p style="color:var(--text-muted)">No ebooks are available yet. Please check back soon.</p>'; return; }
    const cats = {};
    ebooks.forEach(b => { const c = catOf(b); if (c) (cats[c] = cats[c] || []).push(b); });
    const order = CATEGORIES.map(c => c.name).filter(n => cats[n]).concat(Object.keys(cats).filter(n => !CATEGORIES.some(c => c.name === n)));
    const row = list => '<div class="hrow">' + list.map(cardHTML).join('') + '</div>';
    document.getElementById('catChips').innerHTML =
      ['All'].concat(order).map((n, i) => `<button class="cat-chip${i ? '' : ' on'}" data-c="${escHtml(n)}">${escHtml(n)}</button>`).join('');
    document.getElementById('catalogSections').innerHTML =
      `<div class="cat-sec" data-c="All"><div class="catalog-header"><h2>Latest releases</h2></div>${row(ebooks)}</div>` +
      order.map(n => `<div class="cat-sec" data-c="${escHtml(n)}"><div class="catalog-header"><h2>${escHtml(n)}</h2></div>${row(cats[n])}</div>`).join('');
    document.getElementById('catChips').onclick = e => {
      const b = e.target.closest('.cat-chip'); if (!b) return;
      const c = b.dataset.c;
      document.querySelectorAll('.cat-chip').forEach(x => x.classList.toggle('on', x === b));
      document.querySelectorAll('.cat-sec').forEach(x => { x.style.display = (c === 'All' || x.dataset.c === c) ? '' : 'none'; });
    };
  }

  async function loadSiteContent() {
    if (window.orbBlock) document.getElementById('catalogSections').innerHTML = orbBlock('searching', 'Loading ebooks…');
    let banners = FALLBACK_BANNERS;
    let ebooks = FALLBACK_EBOOKS;

    if (typeof supabase !== 'undefined') {
      try {
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const { data, error } = await sb.from('site_content').select('key, value');
        if (!error && data) {
          const bannerRow = data.find(r => r.key === 'banners');
          const ebookRow = data.find(r => r.key === 'ebooks');
          if (bannerRow && bannerRow.value && bannerRow.value.length) banners = bannerRow.value;
          if (ebookRow && ebookRow.value && ebookRow.value.length) ebooks = ebookRow.value;
        }
      } catch (e) { /* fall back to defaults below */ }
    }

    renderBannerSlides(banners);
    renderCatalogGrid(ebooks);
    initSlider();
  }
</script>
<script>
  // Cookie banner (in-memory only, no localStorage per artifact rules)
  document.getElementById('acceptCookies').addEventListener('click', () => {
    document.getElementById('cookieBanner').style.display = 'none';
  });
</script>
<script>
  // --- Promo banner slider: auto-advance, dots, arrows, swipe ---
  function initSlider() {
    const track = document.getElementById('sliderTrack');
    const dotsWrap = document.getElementById('sliderDots');
    const total = track.children.length;
    if (total === 0) return;
    let index = 0;
    let autoTimer;

    dotsWrap.innerHTML = '';
    for (let i = 0; i < total; i++) {
      const dot = document.createElement('button');
      dot.className = 'slider-dot' + (i === 0 ? ' active' : '');
      dot.setAttribute('aria-label', 'Go to banner ' + (i + 1));
      dot.addEventListener('click', () => goTo(i));
      dotsWrap.appendChild(dot);
    }

    function goTo(i) {
      index = (i + total) % total;
      track.style.transform = `translateX(-${index * 100}%)`;
      [...dotsWrap.children].forEach((d, di) => d.classList.toggle('active', di === index));
      resetAuto();
    }
    function next() { goTo(index + 1); }
    function prev() { goTo(index - 1); }

    document.getElementById('nextSlide').addEventListener('click', next);
    document.getElementById('prevSlide').addEventListener('click', prev);

    function resetAuto() {
      clearInterval(autoTimer);
      autoTimer = setInterval(next, 4500);
    }
    resetAuto();

    let startX = 0;
    track.addEventListener('touchstart', (e) => { startX = e.touches[0].clientX; }, { passive: true });
    track.addEventListener('touchend', (e) => {
      const diff = e.changedTouches[0].clientX - startX;
      if (diff > 40) prev();
      else if (diff < -40) next();
    }, { passive: true });

    const sliderSection = document.getElementById('slider');
    sliderSection.addEventListener('mouseenter', () => clearInterval(autoTimer));
    sliderSection.addEventListener('mouseleave', resetAuto);
  }

  loadSiteContent();

  (async function updateProfileLink() {
    if (typeof supabase === 'undefined' || typeof SUPABASE_URL === 'undefined') return;
    try {
      const sbCheck = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const { data: { session } } = await sbCheck.auth.getSession();
      document.getElementById('profileLink').href = session ? 'my-account.html' : 'login.html';
    } catch (e) { /* leave default (login.html) if this check fails */ }
  })();

  (function () {
    const fg = document.getElementById('filterGlass'), fb = document.getElementById('fgBtn'), fi = document.getElementById('fgInput'), none = document.getElementById('fgNone');
    const chips = () => [...document.querySelectorAll('#catChips .cat-chip')];
    const secs = () => [...document.querySelectorAll('#catalogSections .cat-sec')];
    const words = (n) => n.toLowerCase().split(/\s+/);
    // sections whose name (or any word in it) starts with what you typed, A to Z
    const matches = (q) => chips().map(c => c.dataset.c).filter(n => n !== 'All' && words(n).some(w => w.startsWith(q))).sort((a, b) => a.localeCompare(b));

    function restore() {
      chips().forEach(c => { c.style.display = ''; c.style.order = ''; });
      secs().forEach(x => { x.style.order = ''; });
      none.hidden = true;
      const on = document.querySelector('#catChips .cat-chip.on');
      if (on) on.click();
    }
    function filter() {
      const q = fi.value.trim().toLowerCase();
      if (!q) return restore();
      const list = matches(q);
      chips().forEach(c => { const i = list.indexOf(c.dataset.c); c.style.display = i < 0 ? 'none' : ''; c.style.order = i; });
      secs().forEach(x => { const i = list.indexOf(x.dataset.c); x.style.display = i < 0 ? 'none' : ''; x.style.order = i; });
      none.hidden = list.length > 0;
    }
    function close() { fg.classList.remove('open'); fb.setAttribute('aria-expanded', 'false'); fi.value = ''; fi.blur(); restore(); }

    fb.addEventListener('click', () => {
      if (fg.classList.contains('open')) return close();
      fg.classList.add('open'); fb.setAttribute('aria-expanded', 'true');
      setTimeout(() => fi.focus(), 120);
    });
    fi.addEventListener('input', filter);
    document.getElementById('fgForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const q = fi.value.trim().toLowerCase(), first = q && matches(q)[0];
      if (!first) return;
      fi.value = ''; restore();                       // bring all buttons back,
      const chip = chips().find(c => c.dataset.c === first);
      if (chip) chip.click();                          // then open the first match
      fg.classList.remove('open'); fb.setAttribute('aria-expanded', 'false'); fi.blur();
    });
    document.addEventListener('click', (e) => { if (fg.classList.contains('open') && !fg.contains(e.target)) close(); });
  })();
  (function () {
    const nf = document.getElementById('navSearchForm'), ni = document.getElementById('navSearchInput'), nb = document.getElementById('navSearchBtn');
    nb.addEventListener('click', (e) => {
      if (!nf.classList.contains('open')) { e.preventDefault(); nf.classList.add('open'); setTimeout(() => ni.focus(), 250); }
      else if (!ni.value.trim()) { e.preventDefault(); nf.classList.remove('open'); }
    });
    nf.addEventListener('submit', (e) => {
      e.preventDefault();
      const q = ni.value.trim();
      window.location.href = 'ebooks.html' + (q ? '?q=' + encodeURIComponent(q) : '');
    });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') nf.classList.remove('open'); });
    document.addEventListener('click', (e) => { if (!nf.contains(e.target) && !ni.value.trim()) nf.classList.remove('open'); });
  })();

  const hamburgerBtn = document.getElementById('hamburgerBtn');
  const dropdownMenu = document.getElementById('dropdownMenu');
  hamburgerBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    dropdownMenu.classList.toggle('open');
  });
  document.addEventListener('click', (e) => {
    if (!dropdownMenu.contains(e.target) && e.target !== hamburgerBtn) dropdownMenu.classList.remove('open');
  });
</script>
<script>
  // --- Interactive 2D background: a simple ambient field of drifting, glowing
  // dots that scatter near touch/cursor. ---
  (function () {
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    let w, h;
    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const COUNT = window.innerWidth < 700 ? 90 : 150;
    const POINTER_RADIUS = 110;

    const particles = Array.from({ length: COUNT }, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      vx: (Math.random() - 0.5) * 0.3,
      vy: (Math.random() - 0.5) * 0.3,
      r: 1.5 + Math.random() * 2,
    }));

    function drawGlowingDot(p) {
      const P = window.SITE_PARTICLES || { on: true, color: '#ef4444', light: 'rgba(252,180,180,0.95)' };
      if (!P.on) return;
      ctx.save();
      ctx.shadowBlur = 24;
      ctx.shadowColor = P.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = P.light;
      ctx.fill();
      // extra bright core for more punch
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * 0.5, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.fill();
      ctx.restore();
    }

    if (reduceMotion) {
      for (const p of particles) drawGlowingDot(p);
      return;
    }

    const pointer = { x: -9999, y: -9999, active: false };
    window.addEventListener('mousemove', (e) => {
      pointer.x = e.clientX; pointer.y = e.clientY; pointer.active = true;
    });
    window.addEventListener('touchmove', (e) => {
      if (e.touches[0]) {
        pointer.x = e.touches[0].clientX; pointer.y = e.touches[0].clientY; pointer.active = true;
      }
    }, { passive: true });
    window.addEventListener('touchend', () => { pointer.active = false; });
    window.addEventListener('mouseleave', () => { pointer.active = false; });

    function step() {
      ctx.clearRect(0, 0, w, h);

      for (const p of particles) {
        p.x += p.vx;
        p.y += p.vy;

        if (pointer.active) {
          const dx = p.x - pointer.x, dy = p.y - pointer.y;
          const dist = Math.hypot(dx, dy);
          if (dist < POINTER_RADIUS && dist > 0.01) {
            const force = (POINTER_RADIUS - dist) / POINTER_RADIUS;
            p.x += (dx / dist) * force * 3;
            p.y += (dy / dist) * force * 3;
          }
        }

        if (p.x < -10) p.x = w + 10;
        if (p.x > w + 10) p.x = -10;
        if (p.y < -10) p.y = h + 10;
        if (p.y > h + 10) p.y = -10;

        drawGlowingDot(p);
      }

      requestAnimationFrame(step);
    }
    step();
  })();
</script>
<script>
  // --- Randomly flickering glow along each box's outline ---
  (function () {
    const boxes = document.querySelectorAll('.hero-content, section.catalog h2, .link-chip');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    boxes.forEach((el) => {
      el.style.transition = 'box-shadow 1.1s ease';

      if (reduceMotion) {
        el.style.boxShadow = '0 0 18px 2px rgba(255,255,255,0.35)';
        return;
      }

      function glow() {
        const blur = 14 + Math.random() * 26;
        const spread = Math.random() * 5;
        const alpha = 0.25 + Math.random() * 0.45;
        el.style.boxShadow = `0 0 ${blur}px ${spread}px rgba(255,255,255,${alpha})`;
        setTimeout(glow, 1000 + Math.random() * 1500);
      }
      glow();
    });
  })();
</script>
