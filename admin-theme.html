<style>
:root{--bg:#0a0a0a;--card:#171717;--b:#262626;--t:#f5f5f5;--m:#a3a3a3;--a:#ef4444}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,sans-serif;padding:16px;max-width:620px;margin:auto}
h1{font-size:20px}h2{font-size:16px;margin:24px 0 10px}.card{background:var(--card);border:1px solid var(--b);border-radius:12px;padding:14px;margin-bottom:10px}
.card.on{border-color:var(--a)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
input[type=text],input[type=email],input[type=password]{flex:1;min-width:140px;padding:9px;background:#0f0f0f;border:1px solid var(--b);border-radius:8px;color:var(--t)}
input[type=color]{width:44px;height:36px;border:0;background:none;padding:0}button{background:var(--a);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer}
button.g{background:#2a2a2a}img.pv{width:100%;height:90px;object-fit:cover;border-radius:8px;margin-top:10px;background:#111;display:none}
.m{color:var(--m);font-size:13px}#msg{position:sticky;bottom:10px;background:#222;border:1px solid #444;border-radius:10px;padding:10px;display:none}
</style></head><body>
<h1>Theme Manager</h1>
<div id="login" class="card" style="display:none"><b>Admin sign in</b>
  <div class="row"><input type="email" id="em" placeholder="Email"><input type="password" id="pw" placeholder="Password"><button id="go">Sign in</button></div></div>
<div id="app" style="display:none">
  <h2>Site theme</h2><div id="themes"></div>
  <h2>Glowing particles</h2>
  <div class="card">
    <label><input type="checkbox" id="pon"> Show particles <span class="m">(untick to hide them for now)</span></label>
    <div class="row"><label><input type="checkbox" id="pmatch"> Match theme colour</label><input type="color" id="pcol"></div>
  </div>
  <button id="save" style="width:100%;padding:13px">Save &amp; apply to site</button>
</div>
<div id="msg"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script>
<script src="admin-config.js?v=2"></script>
<script>
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY), $ = id => document.getElementById(id);
const DEF = { default:{name:'Default',accent:'#ef4444'}, holi:{name:'Holi',accent:'#d946ef'}, diwali:{name:'Diwali',accent:'#f59e0b'}, summer:{name:'Summer',accent:'#f97316'}, monsoon:{name:'Monsoon',accent:'#38bdf8'} };
let T = { active:'default', themes:JSON.parse(JSON.stringify(DEF)), particles:{on:true,match:true,color:'#ef4444'} };
const say = m => { const e=$('msg'); e.textContent=m; e.style.display='block'; setTimeout(()=>e.style.display='none',3000); };

function draw() {
  $('themes').innerHTML = Object.entries(T.themes).map(([k,t]) => `<div class="card ${T.active===k?'on':''}" data-k="${k}">
    <label><input type="radio" name="act" ${T.active===k?'checked':''}> <b>${t.name}</b></label>
    <div class="row"><input type="color" class="ac" value="${t.accent}"><input type="file" accept="image/*" class="file"><input type="text" class="url" placeholder="or paste image URL" value="${t.image&&t.image.startsWith('http')?t.image:''}"></div>
    <img class="pv" ${t.image?`src="${t.image}" style="display:block"`:''}>${t.image?'<div class="row"><button class="g rm">Remove image</button></div>':''}</div>`).join('');
  $('pon').checked = T.particles.on !== false; $('pmatch').checked = T.particles.match !== false; $('pcol').value = T.particles.color || '#ef4444';
}
const key = e => e.target.closest('[data-k]')?.dataset.k;
$('themes').onclick = e => { const k = key(e); if (!k) return;
  if (e.target.matches('input[type=radio]')) { T.active = k; draw(); }
  if (e.target.matches('.rm')) { delete T.themes[k].image; draw(); } };
$('themes').onchange = e => { const k = key(e); if (!k) return;
  if (e.target.matches('.ac')) T.themes[k].accent = e.target.value;
  if (e.target.matches('.url')) { T.themes[k].image = e.target.value.trim() || undefined; draw(); }
  if (e.target.matches('.file') && e.target.files[0]) { const img = new Image();
    img.onload = () => { const s = Math.min(1, 1280 / img.width), c = document.createElement('canvas'); c.width = img.width*s; c.height = img.height*s;
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); T.themes[k].image = c.toDataURL('image/jpeg', .7); draw(); };
    img.src = URL.createObjectURL(e.target.files[0]); } };
$('save').onclick = async () => {
  T.particles = { on: $('pon').checked, match: $('pmatch').checked, color: $('pcol').value };
  const { error } = await sb.from('site_content').upsert({ key: 'theme', value: T }, { onConflict: 'key' });
  say(error ? 'Could not save: ' + error.message : 'Saved! Refresh your site to see it.'); };
$('go').onclick = async () => { const { error } = await sb.auth.signInWithPassword({ email: $('em').value, password: $('pw').value }); error ? say(error.message) : start(); };
async function start() {
  const { data: { session } } = await sb.auth.getSession();
  $('login').style.display = session ? 'none' : 'block'; $('app').style.display = session ? 'block' : 'none'; if (!session) return;
  const { data } = await sb.from('site_content').select('value').eq('key', 'theme').maybeSingle();
  if (data && data.value) { const v = data.value; T = { active: v.active || 'default', themes: Object.assign({}, JSON.parse(JSON.stringify(DEF)), v.themes), particles: v.particles || T.particles }; }
  draw();
}
start();
</script><script src="admin-nav.js"></script>
</body></html>
