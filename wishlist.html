<style>
  :root{--bg:#0a0a0a;--bg-elevated:#171717;--border:#262626;--text:#f5f5f5;--text-muted:#a3a3a3;--text-dim:#8c8c8c;--accent:#ef4444;--accent-dark:#991b1b;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;}
  header{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--border);}
  header .brand{display:flex;align-items:center;gap:12px;}
  header .brand img{height:32px;width:32px;object-fit:contain;display:block;}
  header .brand strong{color:var(--text);}
  button.signout{background:none;border:1px solid var(--border);color:var(--text-muted);padding:6px 12px;border-radius:6px;font-size:13px;cursor:pointer;}
  button.signout:hover{border-color:var(--accent);color:var(--accent);}
  main{max-width:640px;margin:0 auto;padding:32px 20px 40px;}
  h1{font-size:1.4rem;margin:0 0 4px;}
  .sub{color:var(--text-muted);font-size:13px;margin:0 0 20px;}
  .empty{text-align:center;color:var(--text-dim);padding:40px 16px;font-size:14px;}
  .empty a{color:var(--accent);}

  .item{background:var(--bg-elevated);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px;
        display:flex;align-items:center;gap:14px;}
  .item .cover{width:52px;height:69px;flex:none;border-radius:5px;object-fit:cover;background:#0f0f0f;border:1px solid var(--border);}
  .item .info{flex:1;min-width:0;}
  .item h3{margin:0 0 3px;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .item p{margin:0;font-size:12px;color:var(--text-dim);}
  .item .price{color:var(--text-muted);font-size:13px;margin-top:2px;}
  .item .actions{display:flex;flex-direction:column;gap:6px;flex:none;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;border:0;border-radius:7px;padding:7px 12px;
       font-weight:600;font-size:12.5px;cursor:pointer;font-family:inherit;text-decoration:none;white-space:nowrap;}
  .btn-buy{background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff;}
  .btn-buy:hover{filter:brightness(1.08);}
  .btn-remove{background:none;border:1px solid var(--border);color:var(--text-muted);}
  .btn-remove:hover{border-color:#f87171;color:#f87171;}
</style>
</head>

<script>
  if (typeof supabase === 'undefined' || typeof SUPABASE_URL === 'undefined') {
    document.querySelector('main').innerHTML = '<p class="empty">Could not load — check your connection and reload.</p>';
  } else {
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let currentUser = null;

    function escHtml(s) {
      return (s == null ? '' : String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function safeUrl(u) {
      if (!u) return '#';
      const s = String(u).trim();
      return /^(https?:\/\/|\/|\.\/|#)/i.test(s) ? s : '#';
    }

    async function init() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { window.location.href = 'login.html'; return; }
      currentUser = session.user;
      document.getElementById('userEmailLabel').textContent = currentUser.email;
      loadWishlist();
    }

    async function loadWishlist() {
      const body = document.getElementById('wishBody');
      const { data: rows, error } = await sb
        .from('wishlist')
        .select('ebook_title, created_at')
        .order('created_at', { ascending: false });

      if (error) {
        body.innerHTML = `<p class="empty">Couldn't load your wishlist: ${escHtml(error.message)}` +
          `<br><small>If this is new, make sure wishlist.sql has been run in Supabase.</small></p>`;
        return;
      }
      if (!rows || !rows.length) {
        body.innerHTML = '<p class="empty">Nothing saved yet — tap the ♥ on any ebook to add it here.<br><a href="ebooks.html">Browse ebooks</a></p>';
        return;
      }

      // Match each saved title against the live ebook list for cover/price/buy link.
      // A title that's been removed or renamed since saving still shows, just without those extras.
      let ebookByTitle = {};
      try {
        const { data } = await sb.from('site_content').select('value').eq('key', 'ebooks').single();
        (data && data.value || []).forEach(b => { ebookByTitle[b.title] = b; });
      } catch (e) { /* fine — rows still render without the match */ }

      body.innerHTML = rows.map(r => {
        const b = ebookByTitle[r.ebook_title];
        const hasSale = b && b.on_sale && b.sale_price;
        const price = b ? (hasSale ? b.sale_price : b.price) : null;
        return `
        <div class="item" data-title="${escHtml(r.ebook_title)}">
          ${b && b.cover_image
            ? `<img class="cover" src="${safeUrl(b.cover_image)}" alt="">`
            : `<div class="cover" style="background:${b ? (b.color || '#0f0f0f') : '#0f0f0f'}"></div>`}
          <div class="info">
            <h3>${escHtml(r.ebook_title)}</h3>
            ${price ? `<p class="price">${escHtml(price)}</p>` : `<p>No longer listed</p>`}
          </div>
          <div class="actions">
            ${b ? `<a class="btn btn-buy" href="${safeUrl(b.payment_link)}" data-buy="${escHtml(r.ebook_title)}">Buy now</a>` : ''}
            <button type="button" class="btn btn-remove" data-remove="${escHtml(r.ebook_title)}">Remove</button>
          </div>
        </div>`;
      }).join('');

      body.querySelectorAll('[data-remove]').forEach(btn => btn.addEventListener('click', () => removeItem(btn.dataset.remove)));
    }

    async function removeItem(title) {
      const row = document.querySelector(`.item[data-title="${CSS.escape(title)}"]`);
      if (row) row.style.opacity = '0.5';
      const { error } = await sb.from('wishlist').delete().eq('user_id', currentUser.id).eq('ebook_title', title);
      if (error) { alert('Could not remove: ' + error.message); if (row) row.style.opacity = '1'; return; }
      loadWishlist();
    }

    document.getElementById('signOut').addEventListener('click', async () => {
      await sb.auth.signOut();
      window.location.href = 'login.html';
    });

    init();
  }
</script>
<script src="customer-nav.js"></script>
</body></html>
