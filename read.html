<style>
  :root{--bg:#0a0a0a;--bg-elevated:#171717;--border:#262626;--text:#f5f5f5;--text-muted:#a3a3a3;--text-dim:#8c8c8c;--accent:#ef4444;--accent-dark:#991b1b;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;}
  header{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--border);}
  header a{color:var(--text-muted);text-decoration:none;font-size:14px;}
  header .brand{display:flex;align-items:center;gap:12px;}
  header .brand img{height:32px;width:32px;object-fit:contain;display:block;}
  header .brand strong{color:var(--text);}
  button.signout{background:none;border:1px solid var(--border);color:var(--text-muted);padding:6px 12px;border-radius:6px;font-size:13px;cursor:pointer;}
  button.signout:hover{border-color:var(--accent);color:var(--accent);}
  main{max-width:640px;margin:0 auto;padding:32px 20px 40px;}
  h1{font-size:1.4rem;margin:0 0 4px;}
  .sub{color:var(--text-muted);font-size:13px;margin:0 0 20px;}
  .empty{text-align:center;color:var(--text-dim);padding:32px 0;font-size:14px;}
  .empty a{color:var(--accent);}

  .book{background:var(--bg-elevated);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:12px;
        display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
  .book h3{margin:0 0 4px;font-size:15px;}
  .book p{margin:0;font-size:12px;color:var(--text-dim);}
  .book .actions{display:flex;gap:8px;flex:none;}
  .btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:7px;padding:8px 13px;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit;white-space:nowrap;}
  .btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
  .btn-read{background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff;}
  .btn-read:hover{filter:brightness(1.08);}
  .btn-listen{background:none;border:1px solid var(--border);color:var(--text-muted);}
  .btn-listen:hover{border-color:var(--accent);color:var(--accent);}

  /* ---- reader overlay ---- */
  .reader{position:fixed;inset:0;z-index:300;background:#000;display:none;flex-direction:column;}
  .reader.open{display:flex;}
  .reader-top{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#0f0f0f;border-bottom:1px solid var(--border);flex:none;}
  .reader-top h2{flex:1;margin:0;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .icon-btn{background:none;border:1px solid var(--border);color:var(--text-muted);width:36px;height:36px;border-radius:8px;
            display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;}
  .icon-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
  .icon-btn:hover{border-color:var(--accent);color:var(--accent);}
  .icon-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(239,68,68,.12);}
  .reader-body{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:16px;background:#111;}
  .reader-body canvas{max-width:100%;height:auto;box-shadow:0 8px 30px rgba(0,0,0,.6);background:#fff;border-radius:3px;}
  .reader-state{margin:auto;text-align:center;color:var(--text-muted);font-size:14px;padding:30px;}
  .reader-state.err{color:#f87171;}
  .reader-bottom{display:flex;align-items:center;justify-content:center;gap:14px;padding:12px 14px;background:#0f0f0f;border-top:1px solid var(--border);flex:none;}
  .page-indicator{font-size:13px;color:var(--text-muted);min-width:72px;text-align:center;}
  @media (max-width:480px){ .book{flex-direction:column;align-items:stretch;} .book .actions{justify-content:stretch;} .btn{flex:1;justify-content:center;} }
</style>
</head>

<main>
  <h1>Your library</h1>
  <p class="sub">Open any ebook you've bought to read it here, or tap Listen to have it read aloud.</p>
  <div id="bookList"><p class="empty">Loading your books…</p></div>
</main>

<!-- In-page reader: renders PDF pages to a canvas and can read the current page aloud. -->
<div class="reader" id="reader">
  <div class="reader-top">
    <button class="icon-btn" id="readerClose" aria-label="Close">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <h2 id="readerTitle"></h2>
    <button class="icon-btn" id="readerDownload" aria-label="Download" title="Download">
      <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 21h14"/></svg>
    </button>
    <button class="icon-btn" id="readerListen" aria-label="Listen" title="Listen">
      <svg viewBox="0 0 24 24"><path d="M3 10v4h4l5 5V5L7 10H3Z"/><path d="M16 8.5a5 5 0 0 1 0 7"/></svg>
    </button>
  </div>
  <div class="reader-body" id="readerBody"><div class="reader-state">Loading…</div></div>
  <div class="reader-bottom">
    <button class="icon-btn" id="readerPrev" aria-label="Previous page">
      <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
    </button>
    <span class="page-indicator" id="readerPageInd">–</span>
    <button class="icon-btn" id="readerNext" aria-label="Next page">
      <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
    </button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="admin-config.js?v=2"></script>
<script>
  if (typeof supabase === 'undefined' || typeof SUPABASE_URL === 'undefined') {
    document.querySelector('main').innerHTML = '<p class="empty">Could not load — check your connection and reload.</p>';
  } else {
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const canSpeak = 'speechSynthesis' in window;
    const canRead = typeof pdfjsLib !== 'undefined';
    if (canRead) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';

    function escHtml(s) {
      return (s == null ? '' : String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    async function init() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { window.location.href = 'login.html'; return; }
      document.getElementById('userEmailLabel').textContent = session.user.email;
      loadBooks();
    }

    async function loadBooks() {
      const { data: orders, error } = await sb
        .from('orders')
        .select('ebook_title, created_at, status')
        .eq('status', 'paid')
        .order('created_at', { ascending: false });

      const list = document.getElementById('bookList');
      if (error) { list.innerHTML = `<p class="empty">Couldn't load your books: ${escHtml(error.message)}</p>`; return; }
      if (!orders || !orders.length) {
        list.innerHTML = '<p class="empty">No purchases yet — browse the <a href="ebooks.html">Ebooks page</a> to get started.</p>';
        return;
      }
      list.innerHTML = orders.map(o => `
        <div class="book">
          <div><h3>${escHtml(o.ebook_title)}</h3><p>Purchased ${new Date(o.created_at).toLocaleDateString()}</p></div>
          <div class="actions">
            <button type="button" class="btn btn-listen" data-listen="${escHtml(o.ebook_title)}"${canSpeak ? '' : ' disabled title="Not supported in this browser"'}>
              <svg viewBox="0 0 24 24"><path d="M3 10v4h4l5 5V5L7 10H3Z"/><path d="M16 8.5a5 5 0 0 1 0 7"/></svg>Listen
            </button>
            <button type="button" class="btn btn-read" data-read="${escHtml(o.ebook_title)}">
              <svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H12v18H6.5A2.5 2.5 0 0 1 4 18.5Z"/><path d="M20 5.5A2.5 2.5 0 0 0 17.5 3H12v18h5.5a2.5 2.5 0 0 0 2.5-2.5Z"/></svg>Read
            </button>
          </div>
        </div>`).join('');

      list.querySelectorAll('[data-read]').forEach(b => b.addEventListener('click', () => openReader(b.dataset.read, false)));
      list.querySelectorAll('[data-listen]').forEach(b => b.addEventListener('click', () => openReader(b.dataset.listen, true)));
    }

    // ---------- reader ----------
    const readerEl = document.getElementById('reader');
    const bodyEl = document.getElementById('readerBody');
    const pageIndEl = document.getElementById('readerPageInd');
    const listenBtn = document.getElementById('readerListen');
    let currentTitle = null, pdfDoc = null, pageNum = 1, rendering = false, speaking = false;

    function showState(msg, isErr) {
      bodyEl.innerHTML = `<div class="reader-state${isErr ? ' err' : ''}">${escHtml(msg)}</div>`;
    }

    async function getSignedUrl(title) {
      const { data, error } = await sb.functions.invoke('get-download', { body: { title } });
      if (error || !data || !data.download_url) throw new Error((data && data.error) || 'Could not get a download link.');
      return data.download_url;
    }

    async function openReader(title, startListening) {
      currentTitle = title; pageNum = 1;
      document.getElementById('readerTitle').textContent = title;
      readerEl.classList.add('open');
      stopSpeaking();
      if (!canRead) { showState('In-page reading is not available right now — use Download instead.', true); return; }
      showState('Opening “' + title + '”…');
      pageIndEl.textContent = '–';
      try {
        const url = await getSignedUrl(title);
        pdfDoc = await pdfjsLib.getDocument({ url }).promise;
        await renderPage(pageNum);
        if (startListening) speakCurrentPage();
      } catch (err) {
        pdfDoc = null;
        showState('Couldn\'t open this book: ' + err.message + '. Close and try again — your link may have expired.', true);
      }
    }

    async function renderPage(n) {
      if (!pdfDoc || rendering) return;
      rendering = true;
      try {
        const page = await pdfDoc.getPage(n);
        const scale = Math.min(2, (bodyEl.clientWidth - 32) / page.getViewport({ scale: 1 }).width) || 1;
        const viewport = page.getViewport({ scale: Math.max(scale, 0.5) });
        const canvas = document.createElement('canvas');
        canvas.width = viewport.width; canvas.height = viewport.height;
        bodyEl.innerHTML = ''; bodyEl.appendChild(canvas);
        await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
        pageIndEl.textContent = n + ' / ' + pdfDoc.numPages;
      } catch (err) {
        showState('Couldn\'t show this page: ' + err.message, true);
      } finally {
        rendering = false;
      }
    }

    document.getElementById('readerPrev').addEventListener('click', () => {
      if (!pdfDoc || pageNum <= 1) return;
      stopSpeaking(); pageNum--; renderPage(pageNum);
    });
    document.getElementById('readerNext').addEventListener('click', () => {
      if (!pdfDoc || pageNum >= pdfDoc.numPages) return;
      stopSpeaking(); pageNum++; renderPage(pageNum);
    });
    document.getElementById('readerClose').addEventListener('click', () => {
      stopSpeaking();
      readerEl.classList.remove('open');
      pdfDoc = null;
    });
    document.getElementById('readerDownload').addEventListener('click', async () => {
      if (!currentTitle) return;
      try { window.open(await getSignedUrl(currentTitle), '_blank', 'noopener'); }
      catch (err) { alert('Could not get a download link: ' + err.message); }
    });
    listenBtn.addEventListener('click', () => { speaking ? stopSpeaking() : speakCurrentPage(); });

    // ---------- listen (text-to-speech via the browser's own voice) ----------
    // Chrome has a long-standing bug where a single very long utterance silently cuts off,
    // so the page's text is split into shorter chunks and queued one after another instead.
    function chunkText(text, maxLen) {
      const chunks = [];
      const sentences = text.replace(/\s+/g, ' ').trim().split(/(?<=[.!?])\s+/);
      let cur = '';
      sentences.forEach(s => {
        if ((cur + ' ' + s).trim().length > maxLen && cur) { chunks.push(cur.trim()); cur = s; }
        else cur = (cur + ' ' + s).trim();
      });
      if (cur) chunks.push(cur.trim());
      return chunks.filter(Boolean);
    }

    async function speakCurrentPage() {
      if (!canSpeak || !pdfDoc) return;
      speaking = true;
      listenBtn.classList.add('active');
      try {
        const page = await pdfDoc.getPage(pageNum);
        const tc = await page.getTextContent();
        const text = tc.items.map(i => i.str).join(' ').trim();
        const chunks = text ? chunkText(text, 220) : [];
        if (!chunks.length) { speakNextOrAdvance([]); return; }
        speakQueue(chunks, 0);
      } catch (err) {
        stopSpeaking();
      }
    }

    function speakQueue(chunks, i) {
      if (!speaking) return;
      if (i >= chunks.length) { speakNextOrAdvance(chunks); return; }
      const u = new SpeechSynthesisUtterance(chunks[i]);
      u.onend = () => speaking && speakQueue(chunks, i + 1);
      u.onerror = () => stopSpeaking();
      speechSynthesis.speak(u);
    }

    function speakNextOrAdvance() {
      if (!speaking) return;
      if (pdfDoc && pageNum < pdfDoc.numPages) {
        pageNum++;
        renderPage(pageNum).then(() => speaking && speakCurrentPage());
      } else {
        stopSpeaking();
      }
    }

    function stopSpeaking() {
      speaking = false;
      listenBtn.classList.remove('active');
      if (canSpeak) speechSynthesis.cancel();
    }
    window.addEventListener('beforeunload', stopSpeaking);

    document.getElementById('signOut').addEventListener('click', async () => {
      stopSpeaking();
      await sb.auth.signOut();
      window.location.href = 'login.html';
    });

    init();
  }
</script>
<script src="customer-nav.js"></script>
</body></html>
