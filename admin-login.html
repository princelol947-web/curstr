<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Sign In</title>
<style>
  :root{--bg:#0a0a0a;--bg-elevated:#171717;--border:#262626;--text:#f5f5f5;--text-muted:#a3a3a3;--accent:#f59e0b;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;
       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  form{width:100%;max-width:340px;}
  h1{font-size:1.3rem;margin-bottom:24px;}
  input{width:100%;padding:10px 12px;margin-bottom:14px;background:var(--bg-elevated);
        border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:15px;}
  input:focus-visible{outline:2px solid var(--accent);}
  button{width:100%;padding:10px;background:var(--accent);color:#0a0a0a;font-weight:600;
         border:none;border-radius:6px;font-size:15px;cursor:pointer;}
  .error{color:#f87171;font-size:13px;margin-bottom:12px;}
</style>
</head>
<body>
<form id="loginForm">
  <h1>Admin sign in</h1>
  <p id="error" class="error" style="display:none;"></p>
  <input type="email" id="email" placeholder="Admin email" required />
  <input type="password" id="password" placeholder="Password" required />
  <button type="submit">Sign in</button>
</form>

<script src="https://cdnjs.cloudflare.com/ajax/libs/supabase-js/2.45.0/dist/umd/supabase.min.js"></script>
<script src="admin-config.js"></script>
<script>
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const errorEl = document.getElementById('error');
    errorEl.style.display = 'none';

    if (email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
      errorEl.textContent = 'This account is not authorized as admin.';
      errorEl.style.display = 'block';
      return;
    }

    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) {
      errorEl.textContent = 'Invalid email or password.';
      errorEl.style.display = 'block';
      return;
    }
    window.location.href = 'admin-dashboard.html';
  });
</script>
</body></html>
